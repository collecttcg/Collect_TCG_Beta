name: Finalize Beta 2026-09-18-v09

on:
  push:
    branches: [release-validate-2026-09-18-v09]

jobs:
  validate-promote-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact v09 candidate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2afc3fdbc1f091a89928a46ccc7a5a71ca3940e5"
          git reset --hard 199256af14617204ed2d81b0f1e6920eea71b207
          test "$(git rev-parse HEAD~5)" = "2afc3fdbc1f091a89928a46ccc7a5a71ca3940e5"

      - name: Validate intended scope
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' beta/index.html beta/src/app/register-features.js beta/src/features/content/home.js beta/src/main.js beta/src/styles/29-home-brand-spotlight.css | sort | tr '\n' ' ')"
          actual="$(git diff --name-only 2afc3fdbc1f091a89928a46ccc7a5a71ca3940e5..HEAD | sort | tr '\n' ' ')"
          test "$actual" = "$expected" || { echo "Unexpected scope: $actual"; exit 1; }

      - name: Validate repository
        run: |
          set -euo pipefail
          npm run check
          npm run build
          node --check beta/src/features/content/home.js

      - name: Validate logo showcase removal
        run: |
          set -euo pipefail
          ! grep -Fq 'home-brand-hero-visual' beta/src/features/content/home.js
          ! grep -Fq 'home-brand-hero-logo' beta/src/features/content/home.js
          ! grep -Fq './assets/shop-logo.png' beta/src/features/content/home.js
          grep -Fq 'grid-template-columns:minmax(0,1fr);' beta/src/styles/29-home-brand-spotlight.css
          grep -Fq 'min-height:0;' beta/src/styles/29-home-brand-spotlight.css

          # Brand copy/actions remain.
          grep -Fq 'Rare cards. Curated with intent.' beta/src/features/content/home.js
          grep -Fq 'Browse Inventory' beta/src/features/content/home.js
          grep -Fq 'View Collection' beta/src/features/content/home.js
          grep -Fq 'homeCurrencyPreference' beta/src/features/content/home.js

          # Collector Spotlight and selection rule are unchanged.
          grep -Fq 'Collector Spotlight' beta/src/features/content/home.js
          grep -Fq 'const featured=liveInventory.slice().sort(byValue)[0] || newest[0] || null;' beta/src/features/content/home.js

          grep -Fq '../features/content/home.js?v=2026-09-18-v09' beta/src/app/register-features.js
          grep -Fq './app/register-features.js?v=2026-09-18-v09' beta/src/main.js
          grep -Fq './src/styles/29-home-brand-spotlight.css?v=2026-09-18-v09' beta/index.html
          grep -Fq './src/main.js?v=2026-09-18-v09' beta/index.html

      - name: Compare regression baseline
        run: |
          set -euo pipefail
          npm test > /tmp/v09-tests.log 2>&1 || true
          git worktree add --detach /tmp/v08 2afc3fdbc1f091a89928a46ccc7a5a71ca3940e5
          (cd /tmp/v08 && npm test > /tmp/v08-tests.log 2>&1 || true)

          v09_pass="$(awk '/^# pass /{print $3}' /tmp/v09-tests.log | tail -1)"
          v09_fail="$(awk '/^# fail /{print $3}' /tmp/v09-tests.log | tail -1)"
          v08_pass="$(awk '/^# pass /{print $3}' /tmp/v08-tests.log | tail -1)"
          v08_fail="$(awk '/^# fail /{print $3}' /tmp/v08-tests.log | tail -1)"

          echo "v08 tests: pass=$v08_pass fail=$v08_fail"
          echo "v09 tests: pass=$v09_pass fail=$v09_fail"
          test -n "$v09_pass" -a -n "$v09_fail" -a -n "$v08_pass" -a -n "$v08_fail"
          test "$v09_pass" = "$v08_pass"
          test "$v09_fail" = "$v08_fail"

      - name: Preserve retained behavior markers
        run: |
          set -euo pipefail
          grep -R -q 'Owner Mode' beta/src beta/index.html
          grep -R -q 'Availability' beta/src beta/index.html
          grep -R -q 'Make an offer' beta/src beta/index.html
          grep -R -q 'More photos / video' beta/src beta/index.html
          grep -R -q 'COD / meetup' beta/src beta/index.html

          grep -q 'socialAnalyticsNeedsHumanInteraction' beta/src/services/analytics.js
          grep -q 'facebookexternalhit' beta/src/services/analytics.js
          grep -q 'analyticsHumanInteractionObserved' beta/src/services/analytics.js

          grep -q 'Browse Collection by game' beta/src/features/inventory/page.js
          grep -Fq 'QR Generator' beta/src/features/owner/tools.js
          test -f beta/src/features/owner/insights-dashboard.js
          grep -R -q 'giveaway' beta/src/features/content beta/src/features/owner

          # v07 social footer removal remains.
          ! grep -Fq 'appContext.collectSocialPostLines()' beta/src/features/social/posts.js

      - name: Squash and promote Beta v09
        run: |
          set -euo pipefail
          git config user.name collecttcg
          git config user.email z3313514@gmail.com
          git reset --soft 2afc3fdbc1f091a89928a46ccc7a5a71ca3940e5
          git commit -m 'Beta 2026-09-18-v09: remove Home logo showcase'
          git push origin HEAD:main

      - name: Build release archives
        run: |
          set -euo pipefail
          rm -rf dist node_modules
          mkdir -p /tmp/pkg/full /tmp/pkg/patch
          rsync -a --exclude='.git' --exclude='.github/workflows/finalize-beta-2026-09-18-v09.yml' --exclude='dist' --exclude='node_modules' ./ /tmp/pkg/full/
          (cd /tmp/pkg/full && zip -qr /tmp/Collect-TCG-Beta-2026-09-18-v09-full.zip .)

          for f in beta/index.html beta/src/app/register-features.js beta/src/features/content/home.js beta/src/main.js beta/src/styles/29-home-brand-spotlight.css; do
            mkdir -p "/tmp/pkg/patch/$(dirname "$f")"
            cp "$f" "/tmp/pkg/patch/$f"
          done
          (cd /tmp/pkg/patch && zip -qr /tmp/Collect-TCG-Beta-2026-09-18-v08-to-2026-09-18-v09-patch.zip .)

          unzip -t /tmp/Collect-TCG-Beta-2026-09-18-v09-full.zip
          unzip -t /tmp/Collect-TCG-Beta-2026-09-18-v08-to-2026-09-18-v09-patch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Beta-2026-09-18-v09-release
          path: |
            /tmp/Collect-TCG-Beta-2026-09-18-v09-full.zip
            /tmp/Collect-TCG-Beta-2026-09-18-v08-to-2026-09-18-v09-patch.zip
