name: Refresh Beta SEO card pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/beta-seo.yml'
      - 'tools/generate-seo.mjs'
      - '2026-09-24-v01-SEO-PUBLIC-CATALOG.sql'
      - '2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql'
      - 'beta/src/features/owner/insights-dashboard.js'
      - 'beta/src/features/inventory/page.js'
      - 'beta/src/features/content/home.js'
      - 'beta/src/features/inventory/filtering.js'
      - 'beta/src/features/cards/related.js'
      - '2026-09-24-v08-DISCOVERY-SUMMARY.sql'
      - 'beta/index.html'
      - 'beta/src/app/register-features.js'
      - 'beta/src/app/initialize.js'
      - 'beta/src/app/startup.js'
      - 'beta/src/features/cards/tiles.js'
      - 'beta/src/services/catalogue.js'
      - 'beta/src/app/routing.js'
      - 'beta/src/services/analytics.js'
      - 'beta/src/features/core/utilities.js'
      - 'beta/src/features/cards/details.js'
      - 'beta/src/main.js'
      - 'tests/**'
      - 'tools/check.mjs'

permissions:
  contents: write

concurrency:
  group: beta-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript and repository references
        run: |
          npm test
          npm run check
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test

      - name: Validate Phase 2B1 discovery migration
        shell: bash
        run: |
          set -euo pipefail
          test -s 2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql
          grep -q 'create table if not exists public.card_discovery_views' 2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql
          grep -q 'enable row level security' 2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql
          grep -q 'revoke all on table public.card_discovery_views from anon, authenticated' 2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql
          grep -q 'create or replace function public.record_card_discovery_view' 2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql
          grep -q 'grant execute on function public.record_card_discovery_view' 2026-09-24-v07-DISCOVERY-ATTRIBUTION.sql

      - name: Validate Phase 2 completion
        shell: bash
        run: |
          set -euo pipefail
          test -s 2026-09-24-v08-DISCOVERY-SUMMARY.sql
          grep -q 'create or replace function public.get_card_discovery_summary' 2026-09-24-v08-DISCOVERY-SUMMARY.sql
          grep -q 'public.is_app_owner()' 2026-09-24-v08-DISCOVERY-SUMMARY.sql
          grep -q 'revoke all on function public.get_card_discovery_summary' 2026-09-24-v08-DISCOVERY-SUMMARY.sql
          grep -q 'grant execute on function public.get_card_discovery_summary' 2026-09-24-v08-DISCOVERY-SUMMARY.sql
          grep -q 'function relatedSeriesAffinity' beta/src/features/cards/related.js
          grep -q 'function relatedGradeAffinity' beta/src/features/cards/related.js
          grep -Fq 'unique*100' beta/src/features/inventory/filtering.js
          grep -q 'fetchDiscoverySourceSummary' beta/src/services/analytics.js
          grep -q 'Where card interest starts' beta/src/features/owner/insights-dashboard.js

      - name: Validate fast clean-card navigation
        shell: bash
        run: |
          set -euo pipefail
          node --check beta/src/app/routing.js
          node --check beta/src/features/cards/details.js
          node --check beta/src/app/initialize.js
          grep -Fq 'history.pushState(state,"",cleanUrl.pathname+cleanUrl.search+cleanUrl.hash)' beta/src/app/routing.js
          grep -q 'state.collectTcgSpaCardId=id' beta/src/app/routing.js
          grep -q 'window.addEventListener("popstate", appContext.router)' beta/src/app/routing.js
          grep -q 'history.back()' beta/src/features/cards/details.js
          ! grep -q 'location.assign(clean)' beta/src/app/routing.js
          grep -q 'meta\[name="collect-tcg-card-id"\]' beta/src/app/routing.js
          grep -q 'routing.js?v=2026-09-24-v11' beta/src/app/initialize.js
          grep -q 'details.js?v=2026-09-24-v09' beta/src/app/initialize.js
          grep -q 'event.stopPropagation()' beta/src/features/content/home.js
          grep -q 'appContext.openDetailsModal(card)' beta/src/app/routing.js

      - name: Validate Phase 3 conversion and performance
        shell: bash
        run: |
          set -euo pipefail
          node --check beta/src/features/cards/details.js
          node --check beta/src/services/analytics.js
          node --check beta/src/services/catalogue.js
          node --check beta/src/features/cards/tiles.js
          node --check beta/src/features/owner/insights-dashboard.js
          node --check beta/src/app/startup.js
          grep -q 'function contactCardReferenceLines' beta/src/features/cards/details.js
          grep -q 'recordCardEngagement(card.id,"inquiry_copy",platform)' beta/src/features/cards/details.js
          grep -q 'fetchOwnerCardConversionSummary' beta/src/services/analytics.js
          grep -q 'data-owner-conversion="intent-rate"' beta/src/features/cards/details.js
          grep -q 'cardImageLoadPromises.get(id)' beta/src/services/catalogue.js
          grep -q 'preloadCardDetailsMedia' beta/src/features/cards/tiles.js
          grep -q 'Saved without contact' beta/src/features/owner/insights-dashboard.js
          grep -q 'const directCardEntry=' beta/src/app/startup.js
          grep -q 'Promise.allSettled' beta/src/app/startup.js
          grep -q 'analytics.js?v=2026-09-24-v12' beta/src/app/register-features.js
          grep -q 'catalogue.js?v=2026-09-24-v12' beta/src/app/register-features.js
          grep -q 'tiles.js?v=2026-09-24-v12' beta/src/app/register-features.js
          grep -q 'insights-dashboard.js?v=2026-09-24-v12' beta/src/app/register-features.js
          grep -q 'details.js?v=2026-09-24-v12' beta/src/app/register-features.js
          grep -q 'startup.js?v=2026-09-24-v12' beta/src/app/register-features.js

      - name: Generate Beta SEO card pages
        run: node tools/generate-seo.mjs --beta

      - name: Validate generated SEO files
        run: |
          test -s beta/sitemap.xml
          test -s beta/robots.txt
          test -s beta/seo-slugs.json
          grep -q 'Disallow: /' beta/robots.txt
          grep -q '<urlset' beta/sitemap.xml
          git diff --check

      - name: Commit refreshed SEO pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/cards beta/sitemap.xml beta/robots.txt beta/seo-slugs.json
          if git diff --cached --quiet; then
            echo "SEO output already current."
            exit 0
          fi
          git commit -m "chore: refresh Beta SEO card pages [skip ci]"
          git push

      # Beta v12 packaging: Phase 3 buyer conversion and performance.
      - name: Create Beta release packages
        shell: bash
        env:
          RELEASE_VERSION: 2026-09-24-v12
          PREVIOUS_VERSION: 2026-09-24-v11
          PREVIOUS_COMMIT: 7b0366bbe146b129cc8df6dc783a132b7aa58581
        run: |
          set -euo pipefail
          mkdir -p release
          FULL="release/Collect-TCG-Beta-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Beta-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"

          git archive --format=zip --output="${FULL}" HEAD

          rm -rf .release-patch
          mkdir -p .release-patch
          while IFS= read -r -d '' path; do
            mkdir -p ".release-patch/$(dirname "$path")"
            cp -a "$path" ".release-patch/$path"
          done < <(git diff --name-only --diff-filter=ACMRT -z "${PREVIOUS_COMMIT}" HEAD)

          git diff --name-only --diff-filter=D "${PREVIOUS_COMMIT}" HEAD > .release-patch/PATCH-DELETIONS.txt
          (
            cd .release-patch
            zip -qr "../${PATCH}" .
          )

          unzip -tq "${FULL}"
          unzip -tq "${PATCH}"

      - name: Upload Beta release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Beta-2026-09-24-v12-packages
          path: |
            release/Collect-TCG-Beta-2026-09-24-v12-full.zip
            release/Collect-TCG-Beta-2026-09-24-v11-to-2026-09-24-v12-patch.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record package validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          MANIFEST="release-manifests/2026-09-24-v12.txt"
          {
            echo "Version: 2026-09-24-v12"
            echo "Previous version: 2026-09-24-v11"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Full ZIP: Collect-TCG-Beta-2026-09-24-v12-full.zip"
            echo "Patch ZIP: Collect-TCG-Beta-2026-09-24-v11-to-2026-09-24-v12-patch.zip"
            echo
            sha256sum release/*.zip
          } > "$MANIFEST"
          git add "$MANIFEST"
          git commit -m "Beta 2026-09-24-v12: record package validation"
          git push
