name: Refresh Beta SEO card pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/beta-seo.yml'
      - 'tools/generate-seo.mjs'
      - '2026-09-24-v01-SEO-PUBLIC-CATALOG.sql'
      - 'beta/index.html'
      - 'beta/src/app/register-features.js'
      - 'beta/src/app/routing.js'
      - 'beta/src/features/core/utilities.js'
      - 'beta/src/features/cards/details.js'
      - 'beta/src/main.js'
      - 'tests/**'
      - 'tools/check.mjs'

permissions:
  contents: write

concurrency:
  group: beta-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript and repository references
        run: |
          npm test
          npm run check
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test

      - name: Generate Beta SEO card pages
        run: node tools/generate-seo.mjs --beta

      - name: Validate generated SEO files
        run: |
          test -s beta/sitemap.xml
          test -s beta/robots.txt
          test -s beta/seo-slugs.json
          grep -q 'Disallow: /' beta/robots.txt
          grep -q '<urlset' beta/sitemap.xml
          git diff --check

      - name: Commit refreshed SEO pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/cards beta/sitemap.xml beta/robots.txt beta/seo-slugs.json
          if git diff --cached --quiet; then
            echo "SEO output already current."
            exit 0
          fi
          git commit -m "chore: refresh Beta SEO card pages [skip ci]"
          git push

      - name: Create Beta release packages
        shell: bash
        env:
          RELEASE_VERSION: 2026-09-24-v06
          PREVIOUS_VERSION: 2026-09-24-v05
          PREVIOUS_COMMIT: 3f3cbcc09a8159d68811150cef683d3781da26d7
        run: |
          set -euo pipefail
          mkdir -p release
          FULL="release/Collect-TCG-Beta-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Beta-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"

          git archive --format=zip --output="${FULL}" HEAD

          rm -rf .release-patch
          mkdir -p .release-patch
          while IFS= read -r -d '' path; do
            mkdir -p ".release-patch/$(dirname "$path")"
            cp -a "$path" ".release-patch/$path"
          done < <(git diff --name-only --diff-filter=ACMRT -z "${PREVIOUS_COMMIT}" HEAD)

          git diff --name-only --diff-filter=D "${PREVIOUS_COMMIT}" HEAD > .release-patch/PATCH-DELETIONS.txt
          (
            cd .release-patch
            zip -qr "../${PATCH}" .
          )

          unzip -tq "${FULL}"
          unzip -tq "${PATCH}"

      - name: Upload Beta release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Beta-2026-09-24-v06-packages
          path: |
            release/Collect-TCG-Beta-2026-09-24-v06-full.zip
            release/Collect-TCG-Beta-2026-09-24-v05-to-2026-09-24-v06-patch.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record package validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          MANIFEST="release-manifests/2026-09-24-v06.txt"
          {
            echo "Version: 2026-09-24-v06"
            echo "Previous version: 2026-09-24-v05"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Full ZIP: Collect-TCG-Beta-2026-09-24-v06-full.zip"
            echo "Patch ZIP: Collect-TCG-Beta-2026-09-24-v05-to-2026-09-24-v06-patch.zip"
            echo
            sha256sum release/*.zip
          } > "$MANIFEST"
          git add "$MANIFEST"
          git commit -m "Beta 2026-09-24-v06: record package validation"
          git push
