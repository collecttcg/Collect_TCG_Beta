name: Finalize Standalone Insights Beta v02

on:
  push:
    branches:
      - release-validate-2026-09-18-v02-standalone-insights
    paths:
      - .github/workflows/finalize-standalone-insights-beta-v02.yml

permissions:
  contents: write

jobs:
  validate-promote-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact Beta v01 baseline
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/update-standalone-insights-v02.py /tmp/update-standalone-insights-v02.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5d5fdd5ea53637acd833db49f8b6cd36f793718b"
          git checkout -B main origin/main
          npm test > /tmp/v01-tests.txt 2>&1 || true

      - name: Apply standalone Insights v02
        run: python /tmp/update-standalone-insights-v02.py

      - name: Validate standalone v02
        shell: bash
        run: |
          set -euo pipefail
          node --check insights/app.js
          node --check insights/sw.js
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('insights')
          html=(root/'index.html').read_text()
          app=(root/'app.js').read_text()
          css=(root/'styles.css').read_text()
          sw=(root/'sw.js').read_text()
          json.loads((root/'manifest.webmanifest').read_text())
          refs=re.findall(r'(?:src|href)="(\./[^"?#]+)',html)
          missing=[ref for ref in refs if not (root/ref[2:]).exists()]
          if missing: raise SystemExit('Missing local HTML refs: '+', '.join(missing))
          for marker in ['eraDemand','priceBandDemand','marketDemand','opportunityList','languageDemand']:
              if f'id="{marker}"' not in html: raise SystemExit('Missing panel '+marker)
          for marker in ['get_owner_cards','get_country_card_view_insights','contactViewed','intentCount','groupDemand','priceBand','marketDemandRows']:
              if marker not in app: raise SystemExit('Missing app marker '+marker)
          for marker in ['is_app_owner','persistSession:true']:
              if marker not in app: raise SystemExit('Owner security marker missing '+marker)
          lowered=app.lower()
          for forbidden in ['.insert(','.update(','.delete(','.upsert(','service_role']:
              if forbidden in lowered: raise SystemExit('Read-only safety violation '+forbidden)
          if 'Price band demand' not in html: raise SystemExit('Price Band is not visible')
          if 'collect-tcg-insights-beta-2026-09-18-v02' not in sw: raise SystemExit('v02 cache namespace missing')
          if 'keys.filter(key=>key!==CACHE)' in sw: raise SystemExit('unsafe global cache cleanup')
          if '.demand-row' not in css or '.market-card' not in css: raise SystemExit('intelligence CSS missing')
          print('Standalone v02 static validation passed')
          PY

      - name: Validate existing Beta repository
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run build
          npm test > /tmp/v02-tests.txt 2>&1 || true
          python - <<'PY'
          import re
          from pathlib import Path
          def counts(path):
              s=Path(path).read_text()
              p=re.search(r'# pass (\d+)',s)
              f=re.search(r'# fail (\d+)',s)
              if not p or not f: raise SystemExit('Could not parse test summary '+path)
              return int(p.group(1)),int(f.group(1))
          before=counts('/tmp/v01-tests.txt')
          after=counts('/tmp/v02-tests.txt')
          print('Tests baseline',before,'updated',after)
          if before!=after: raise SystemExit('Regression test counts changed')
          PY

      - name: Verify exact release scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git status --short
          git status --short | sed 's/^...//' | sort > /tmp/changed.txt
          printf '%s\n' insights/README.md insights/app.js insights/index.html insights/styles.css insights/sw.js | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit Beta v02
        shell: bash
        run: |
          set -euo pipefail
          git config user.name collecttcg
          git config user.email z3313514@gmail.com
          git add insights/README.md insights/app.js insights/index.html insights/styles.css insights/sw.js
          git commit -m 'Beta 2026-09-18-v02: align standalone Insights intelligence'
          git push origin HEAD:main

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          mkdir -p release/patch release/standalone
          zip -qr release/Collect-TCG-Beta-2026-09-18-v02-full.zip . -x '.git/*' '.github/*' 'release/*'
          git diff --name-only 5d5fdd5ea53637acd833db49f8b6cd36f793718b "$HEAD_SHA" > /tmp/v02-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "release/patch/$(dirname "$file")"
            cp "$file" "release/patch/$file"
          done < /tmp/v02-files.txt
          (cd release/patch && zip -qr ../Collect-TCG-Beta-2026-09-18-v01-to-2026-09-18-v02-patch.zip .)
          cp -R insights/. release/standalone/
          (cd release/standalone && zip -qr ../Collect-TCG-Insights-Beta-2026-09-18-v02-full.zip .)
          unzip -t release/Collect-TCG-Beta-2026-09-18-v02-full.zip >/dev/null
          unzip -t release/Collect-TCG-Beta-2026-09-18-v01-to-2026-09-18-v02-patch.zip >/dev/null
          unzip -t release/Collect-TCG-Insights-Beta-2026-09-18-v02-full.zip >/dev/null

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Beta-2026-09-18-v02-standalone-insights-release
          path: |
            release/Collect-TCG-Beta-2026-09-18-v02-full.zip
            release/Collect-TCG-Beta-2026-09-18-v01-to-2026-09-18-v02-patch.zip
            release/Collect-TCG-Insights-Beta-2026-09-18-v02-full.zip
          if-no-files-found: error
