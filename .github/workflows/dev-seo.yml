          grep -Fq 'register-features.js?v=2026-09-29-v04' dev/src/main.js
          grep -Fq 'initialize.js?v=2026-09-29-v04' dev/src/main.js
          grep -Fq 'src/main.js?v=2026-09-29-v04' dev/index.html
          node --test tests/features.test.mjs
          git diff --check

      - name: Create Development release packages
        shell: bash
        env:
          RELEASE_VERSION: 2026-09-29-v04
          PREVIOUS_VERSION: 2026-09-29-v03
          PREVIOUS_COMMIT: be2e82d27e814693823e208984ae981e5fe5042f
        run: |
          set -euo pipefail
          mkdir -p release
          FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"

          git archive --format=zip --output="${FULL}" HEAD

          rm -rf .release-patch
          mkdir -p .release-patch
          while IFS= read -r -d '' path; do
            mkdir -p ".release-patch/$(dirname "$path")"
            cp -a "$path" ".release-patch/$path"
          done < <(git diff --name-only --diff-filter=ACMRT -z "${PREVIOUS_COMMIT}" HEAD)

          git diff --name-only --diff-filter=D "${PREVIOUS_COMMIT}" HEAD > .release-patch/PATCH-DELETIONS.txt
          (
            cd .release-patch
            zip -qr "../${PATCH}" .
          )

          unzip -tq "${FULL}"
          unzip -tq "${PATCH}"

      - name: Upload Development release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Dev-2026-09-29-v04-packages
          path: |
            release/Collect-TCG-Dev-2026-09-29-v04-full.zip
            release/Collect-TCG-Dev-2026-09-29-v03-to-2026-09-29-v04-patch.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record package validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          MANIFEST="release-manifests/2026-09-29-v04.txt"
          {
            echo "Version: 2026-09-29-v04"
            echo "Previous version: 2026-09-29-v03"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Full ZIP: Collect-TCG-Dev-2026-09-29-v04-full.zip"
            echo "Patch ZIP: Collect-TCG-Dev-2026-09-29-v03-to-2026-09-29-v04-patch.zip"
            echo
            sha256sum release/*.zip
          } > "$MANIFEST"
          git add "$MANIFEST"
          git commit -m "Development 2026-09-29-v04: record package validation"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Development site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
