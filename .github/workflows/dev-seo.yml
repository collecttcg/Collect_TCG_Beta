name: Refresh Development SEO card pages
on:
  workflow_dispatch: null
  schedule:
  - cron: 17 3 * * *
  push:
    branches:
    - main
    paths:
    - .github/workflows/dev-seo.yml
    - tools/generate-seo.mjs
    - COLLECT_TCG_BASELINE.md
    - README.md
    - package.json
    - docs/**
    - migrations/**
    - dev/src/features/owner/insights-dashboard.js
    - dev/src/features/owner/insights-extension-host.js
    - dev/src/features/owner/insights-intent-rates.js
    - dev/src/features/social/posts.js
    - dev/src/features/social/posts-*.js
    - dev/src/features/inventory/page.js
    - dev/src/features/inventory/page-shell.js
    - dev/src/features/inventory/pagination.js
    - dev/src/features/cards/modal-keyboard.js
    - dev/src/features/content/home.js
    - dev/src/features/content/information.js
    - dev/src/features/media/collage.js
    - dev/src/styles/01-foundation.css
    - dev/src/styles/02-components.css
    - dev/src/styles/27-insights-dashboard.css
    - dev/src/features/inventory/filtering.js
    - dev/src/features/inventory/ordering.js
    - dev/src/features/owner/lifecycle.js
    - dev/src/features/owner/tools.js
    - dev/src/features/owner/bulk-status.js
    - dev/src/features/owner/image-maintenance.js
    - dev/src/app/navigation.js
    - dev/src/features/cards/repository.js
    - dev/src/features/cards/related.js
    - dev/index.html
    - dev/src/app/register-features.js
    - dev/src/app/initialize.js
    - dev/src/app/startup.js
    - dev/src/features/cards/tiles.js
    - dev/src/services/catalogue.js
    - dev/src/app/routing.js
    - dev/src/ui/notifications.js
    - dev/src/services/analytics.js
    - dev/src/features/core/utilities.js
    - dev/src/features/cards/details.js
    - dev/src/features/cards/compare.js
    - dev/src/styles/29-home-brand-spotlight.css
    - dev/src/main.js
    - tests/**
    - tools/check.mjs
    - tools/check-css.mjs
    - tools/release-contracts.sh
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dev-seo-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Run feature regression tests
      run: npm test
    - name: Validate SEO generator syntax and self-test
      run: 'node --check tools/generate-seo.mjs

        node tools/generate-seo.mjs --self-test

        '
    - name: Generate Development SEO card pages
      run: node tools/generate-seo.mjs --dev
    - name: Validate JavaScript and repository references
      run: npm run check
    - name: Validate CSS and retained release contracts
      shell: bash
      run: 'npm run check:css

        bash tools/release-contracts.sh'
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
    - name: Upload Development site for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dev
    - name: Commit refreshed SEO pages
      shell: bash
      run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\
        \ngit add dev/cards dev/sitemap.xml dev/robots.txt dev/seo-slugs.json dev/owner-card-routes.json\nif git diff --cached\
        \ --quiet; then\n  echo \"SEO output already current.\"\n  exit 0\nfi\ngit commit -m \"chore: refresh Development\
        \ SEO card pages [skip ci]\"\ngit push\n"
    - name: Create Development release packages
      shell: bash
      env:
        RELEASE_VERSION: 2026-09-29-v14
        PREVIOUS_VERSION: 2026-09-29-v13
        PREVIOUS_COMMIT: 0727971bb2a34906e18e6209db28e2c309c1929a
      run: "set -euo pipefail\nmkdir -p release\nFULL=\"release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip\"\nPATCH=\"release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip\"\
        \n\ngit archive --format=zip --output=\"${FULL}\" HEAD\n\nrm -rf .release-patch\nmkdir -p .release-patch\nwhile IFS=\
        \ read -r -d '' path; do\n  mkdir -p \".release-patch/$(dirname \"$path\")\"\n  cp -a \"$path\" \".release-patch/$path\"\
        \ndone < <(git diff --name-only --diff-filter=ACMRT -z \"${PREVIOUS_COMMIT}\" HEAD)\n\ngit diff --name-only --diff-filter=D\
        \ \"${PREVIOUS_COMMIT}\" HEAD > .release-patch/PATCH-DELETIONS.txt\n(\n  cd .release-patch\n  zip -qr \"../${PATCH}\"\
        \ .\n)\n\nunzip -tq \"${FULL}\"\nunzip -tq \"${PATCH}\"\n"
    - name: Upload Development release packages
      uses: actions/upload-artifact@v4
      with:
        name: Collect-TCG-Dev-2026-09-29-v14-packages
        path: 'release/Collect-TCG-Dev-2026-09-29-v14-full.zip

          release/Collect-TCG-Dev-2026-09-29-v13-to-2026-09-29-v14-patch.zip

          '
        if-no-files-found: error
        retention-days: 30
    - name: Record package validation manifest
      shell: bash
      run: "set -euo pipefail\nmkdir -p release-manifests\nMANIFEST=\"release-manifests/2026-09-29-v14.txt\"\n{\n  echo \"\
        Version: 2026-09-29-v14\"\n  echo \"Previous version: 2026-09-29-v13\"\n  echo \"Source commit: $(git rev-parse HEAD)\"\
        \n  echo \"Full ZIP: Collect-TCG-Dev-2026-09-29-v14-full.zip\"\n  echo \"Patch ZIP: Collect-TCG-Dev-2026-09-29-v13-to-2026-09-29-v14-patch.zip\"\
        \n  echo\n  sha256sum release/*.zip\n} > \"$MANIFEST\"\ngit add \"$MANIFEST\"\ngit commit -m \"Development 2026-09-29-v14:\
        \ record package validation\"\ngit push\n"
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy Development site to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4