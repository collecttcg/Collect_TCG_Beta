name: Finalize Beta v03 Collection Layout

on:
  push:
    branches:
      - release-validate-2026-09-18-v03-collection-layout
    paths:
      - .github/workflows/finalize-beta-v03-collection-layout.yml

permissions:
  contents: write

jobs:
  validate-promote-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Beta v02 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2b29739173ac352035d1752f0799d4e581be0714"

      - name: Apply Collection game-browser layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('beta/src/features/inventory/page.js')
          s=p.read_text()
          replacements=[
          ('''      ${scope==="inventory" ? `\n        <section class="inventory-game-browser" id="inventoryGameBrowser" aria-label="Browse inventory by game"></section>\n      ` : ""}\n''','''      ${["inventory","collection"].includes(scope) ? `\n        <section class="inventory-game-browser" id="inventoryGameBrowser" aria-label="Browse ${isCollection ? "Collection" : "Inventory"} by game"></section>\n      ` : ""}\n'''),
          ('''    // Inventory is discovery-first: show a small set of buyer-friendly game\n    // families above one continuous grid. Collection/NFS deliberately keeps its\n    // existing expandable catalogue groups and owner ordering controls.\n''','''    // Inventory and Collection are discovery-first: show a small set of\n    // game families above one continuous grid. The grouped catalogue view is\n    // retained only while an owner is actively rearranging cards/games.\n'''),
          ('''      const allTile=`\n        <button type="button" class="inventory-game-tile ${allActive ? "active" : ""}" data-inventory-game-family="all" aria-pressed="${allActive ? "true" : "false"}">\n          <span class="inventory-game-art inventory-game-art-all" aria-hidden="true"><span>ALL</span></span>\n          <span class="inventory-game-tile-copy"><strong>All Inventory</strong><small>${scopedCards.length.toLocaleString()} ${scopedCards.length===1?"card":"cards"}</small></span>\n        </button>`;\n''','''      const browserLabel=appContext.listingAvailabilityScope==="collection" ? "Collection" : "Inventory";\n      const allTile=`\n        <button type="button" class="inventory-game-tile ${allActive ? "active" : ""}" data-inventory-game-family="all" aria-pressed="${allActive ? "true" : "false"}">\n          <span class="inventory-game-art inventory-game-art-all" aria-hidden="true"><span>ALL</span></span>\n          <span class="inventory-game-tile-copy"><strong>All ${browserLabel}</strong><small>${scopedCards.length.toLocaleString()} ${scopedCards.length===1?"card":"cards"}</small></span>\n        </button>`;\n'''),
          ('''      return `\n        <div class="inventory-game-browser-head">\n          <div><span class="eyebrow">Browse the vault</span><h3>Shop by game</h3></div>\n          <span>Choose a game to refine the grid</span>\n        </div>\n''','''      return `\n        <div class="inventory-game-browser-head">\n          <div><span class="eyebrow">Browse the vault</span><h3>${appContext.listingAvailabilityScope==="collection" ? "Browse Collection by game" : "Shop by game"}</h3></div>\n          <span>Choose a game to refine the grid</span>\n        </div>\n'''),
          ('''    function syncInventoryGameBrowser(){\n      const mount=appContext.$("inventoryGameBrowser");\n      if(!mount || appContext.listingAvailabilityScope!=="inventory") return;\n''','''    function syncInventoryGameBrowser(){\n      const mount=appContext.$("inventoryGameBrowser");\n      if(!mount || !["inventory","collection"].includes(appContext.listingAvailabilityScope)) return;\n'''),
          ('''        // Catalogue views remain continuous so discovery filters never split\n        // a selected game across pagination pages. Collection always retains\n        // its grouped showcase; Inventory switches to one grid for buyers and\n        // temporarily restores groups only while an owner is rearranging.\n''','''        // Catalogue views remain continuous so discovery filters never split\n        // a selected game across pagination pages. Inventory and Collection\n        // both use the game-browser + continuous-grid layout, temporarily\n        // restoring grouped headers only while an owner is rearranging.\n'''),
          ('''        const groupedView=appContext.listingAvailabilityScope==="collection" || collectionRearrangeMode;\n''','''        const groupedView=collectionRearrangeMode;\n''')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Missing page.js marker: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s)

          updates=[
              ('beta/src/app/register-features.js','../features/inventory/page.js?v=2026-09-17-v10','../features/inventory/page.js?v=2026-09-18-v03'),
              ('beta/src/main.js','./app/register-features.js?v=2026-09-17-v19','./app/register-features.js?v=2026-09-18-v03'),
              ('beta/index.html','./src/main.js?v=2026-09-17-v19','./src/main.js?v=2026-09-18-v03')
          ]
          for path,old,new in updates:
              q=Path(path)
              text=q.read_text()
              if old not in text:
                  raise SystemExit(f'Missing cache marker in {path}: {old}')
              q.write_text(text.replace(old,new,1))
          PY

      - name: Validate JavaScript imports assets and build
        shell: bash
        run: |
          set -euo pipefail
          node --check beta/src/features/inventory/page.js
          npm run check
          npm run build

      - name: Compare regression baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm test > /tmp/tests.log 2>&1
          code=$?
          set -e
          cat /tmp/tests.log
          test "$code" -eq 1
          grep -q '# tests 21' /tmp/tests.log
          grep -q '# pass 19' /tmp/tests.log
          grep -q '# fail 2' /tmp/tests.log

      - name: Verify Collection behavior guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('beta/src/features/inventory/page.js').read_text()
          checks={
              'Collection game browser mount':'["inventory","collection"].includes(scope)' in s and 'id="inventoryGameBrowser"' in s,
              'Collection normal continuous grid':'const groupedView=collectionRearrangeMode;' in s,
              'Collection grouped rearrange retained':'? groupedCollectionHTML(list' in s,
              'Collection rearrange controls retained':'collectionRearrangeBtn' in s and 'collectionMobileOwnerBtn' in s,
              'Collection collage retained':'collectionExportCollageBtn' in s and 'collectionMobileCollageBtn' in s,
              'One Piece series chips retained':'data-inventory-game-series' in s,
              'Game logos retained':'const inventoryGameLogos=' in s,
              'Collection-specific labels':'All ${browserLabel}' in s and 'Browse Collection by game' in s,
              'Owner Mode marker':'canManageCollectionOrder' in s,
          }
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL'), name)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Verify exact release scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            beta/index.html
            beta/src/app/register-features.js
            beta/src/features/inventory/page.js
            beta/src/main.js
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file"
          done

      - name: Commit Beta 2026-09-18-v03
        shell: bash
        run: |
          set -euo pipefail
          git config user.name collecttcg
          git config user.email z3313514@gmail.com
          git add beta/index.html beta/src/app/register-features.js beta/src/features/inventory/page.js beta/src/main.js
          git commit -m 'Beta 2026-09-18-v03: align Collection with game-browser layout'
          git push origin HEAD:main

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          mkdir -p release/patch
          zip -qr release/Collect-TCG-Beta-2026-09-18-v03-full.zip . -x '.git/*' '.github/*' 'release/*'
          git diff --name-only 2b29739173ac352035d1752f0799d4e581be0714 "$HEAD_SHA" > /tmp/v03-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "release/patch/$(dirname "$file")"
            cp "$file" "release/patch/$file"
          done < /tmp/v03-files.txt
          (cd release/patch && zip -qr ../Collect-TCG-Beta-2026-09-18-v02-to-2026-09-18-v03-patch.zip .)
          unzip -t release/Collect-TCG-Beta-2026-09-18-v03-full.zip
          unzip -t release/Collect-TCG-Beta-2026-09-18-v02-to-2026-09-18-v03-patch.zip

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Beta-2026-09-18-v03-collection-layout-release
          path: |
            release/Collect-TCG-Beta-2026-09-18-v03-full.zip
            release/Collect-TCG-Beta-2026-09-18-v02-to-2026-09-18-v03-patch.zip
          if-no-files-found: error
