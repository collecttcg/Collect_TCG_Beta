name: Finalize Beta v16 Insights

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-insights-v16.yml

permissions:
  contents: write

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh entry cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('beta/index.html')
          t=p.read_text()
          old='main.js?v=2026-09-17-v15'
          new='main.js?v=2026-09-17-v16'
          if t.count(old)!=1:
              raise SystemExit(f'Expected one v15 main cache reference, found {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY

      - name: Verify bounded Insights observers
        shell: bash
        run: |
          for file in beta/src/features/owner/insights-intent-rates.js beta/src/features/owner/insights-dashboard.js; do
            ! grep -Fq 'observer.observe(appContext.view' "$file"
            ! grep -Fq 'subtree:true' "$file"
            grep -Fq 'requestAnimationFrame(run)' "$file"
          done
          grep -Fq 'observer.observe(root,{childList:true});' beta/src/features/owner/insights-intent-rates.js
          grep -Fq 'observer.observe(overview,{childList:true});' beta/src/features/owner/insights-intent-rates.js
          grep -Fq 'observer.observe(root,{childList:true});' beta/src/features/owner/insights-dashboard.js
          grep -Fq 'insights-intent-rates.js?v=2026-09-17-v16' beta/src/app/register-features.js
          grep -Fq 'register-features.js?v=2026-09-17-v16' beta/src/main.js
          grep -Fq 'main.js?v=2026-09-17-v16' beta/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repository checks
        run: npm run check

      - name: Build smoke test
        run: npm run build

      - name: Compare feature tests with v15 baseline
        shell: bash
        run: |
          node --test tests/*.test.mjs > /tmp/v16-tests.log 2>&1 || true
          git worktree add --detach /tmp/v15 ac6b50f4bf1ecd18258cddd83b5cc6c2b98abfe5
          (cd /tmp/v15 && node --test tests/*.test.mjs > /tmp/v15-tests.log 2>&1 || true)
          echo '--- v15 summary ---'
          grep -E '^# (tests|pass|fail)' /tmp/v15-tests.log || true
          echo '--- v16 summary ---'
          grep -E '^# (tests|pass|fail)' /tmp/v16-tests.log || true
          V15_FAIL=$(grep '^# fail ' /tmp/v15-tests.log | awk '{print $3}' | tail -1)
          V16_FAIL=$(grep '^# fail ' /tmp/v16-tests.log | awk '{print $3}' | tail -1)
          test "${V15_FAIL:-999}" = "${V16_FAIL:-998}"

      - name: Retained behavior markers
        shell: bash
        run: |
          grep -Fq 'Availability' beta/index.html
          grep -Fq 'Make an offer' beta/index.html
          grep -Fq 'More photos / video' beta/index.html
          grep -Fq 'COD / meetup' beta/index.html
          grep -Fq 'owner-mode' beta/src/styles/01-foundation.css

      - name: Commit final v16 tree
        shell: bash
        run: |
          git config user.name collecttcg
          git config user.email z3313514@gmail.com
          git add beta/index.html
          git rm .github/workflows/finalize-insights-v16.yml
          git commit -m 'Beta 2026-09-17-v16: finalize Insights freeze fix'
          git push origin HEAD:main

      - name: Build release archives
        shell: bash
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          mkdir -p release/patch
          zip -qr release/Collect-TCG-Beta-2026-09-17-v16-full.zip . -x '.git/*' 'release/*' '.github/*'
          git diff --name-only ac6b50f4bf1ecd18258cddd83b5cc6c2b98abfe5 "$HEAD_SHA" > /tmp/v16-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "release/patch/$(dirname "$file")"
            cp "$file" "release/patch/$file"
          done < /tmp/v16-files.txt
          (cd release/patch && zip -qr ../Collect-TCG-Beta-2026-09-17-v15-to-2026-09-17-v16-patch.zip .)
          unzip -t release/Collect-TCG-Beta-2026-09-17-v16-full.zip
          unzip -t release/Collect-TCG-Beta-2026-09-17-v15-to-2026-09-17-v16-patch.zip
          echo 'Changed files:'
          cat /tmp/v16-files.txt

      - name: Upload v16 release package
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Beta-2026-09-17-v16-release
          path: |
            release/Collect-TCG-Beta-2026-09-17-v16-full.zip
            release/Collect-TCG-Beta-2026-09-17-v15-to-2026-09-17-v16-patch.zip
          if-no-files-found: error
